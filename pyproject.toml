[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qvb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "obspy", "numpy", "scipy", "pandas", "matplotlib", "requests",
  "pyarrow", "duckdb", "scikit-learn", "joblib", "plotly", "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "dbt-duckdb"]

[tool.setuptools.packages.find]
where = ["src"]
